name: Build EXIT Launcher

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create Project Structure
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/java/com/exit/ui
        mkdir -p app/src/main/java/com/exit/commands

    - name: Create AndroidManifest.xml
      run: |
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.exit">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
            <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.FLASHLIGHT" />

            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:theme="@style/Theme.EXIT"
                android:largeHeap="true">

                <activity
                    android:name=".ui.TerminalActivity"
                    android:exported="true"
                    android:launchMode="singleTask"
                    android:screenOrientation="portrait">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

            </application>
        </manifest>
        EOF

    - name: Create Strings
      run: |
        cat > app/src/main/res/values/strings.xml << 'EOF'
        <resources>
            <string name="app_name">EXIT Launcher</string>
        </resources>
        EOF

    - name: Create Theme
      run: |
        cat > app/src/main/res/values/themes.xml << 'EOF'
        <resources>
            <style name="Theme.EXIT" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="android:windowFullscreen">true</item>
                <item name="android:windowNoTitle">true</item>
                <item name="android:windowActionBar">false</item>
                <item name="android:windowBackground">@android:color/black</item>
                <item name="android:statusBarColor">@android:color/transparent</item>
                <item name="android:navigationBarColor">@android:color/transparent</item>
            </style>
        </resources>
        EOF

    - name: Create Layout
      run: |
        cat > app/src/main/res/layout/activity_terminal.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#0a0a0f"
            android:padding="8dp">

            <ScrollView
                android:id="@+id/terminal_scroll"
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1"
                android:background="#0d0d1a">

                <TextView
                    android:id="@+id/terminal_output"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:fontFamily="monospace"
                    android:textSize="15sp"
                    android:textColor="#b8c7e0"
                    android:padding="8dp" />
            </ScrollView>

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:background="#1a1a24"
                android:padding="4dp">

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="┌──(exit㉿android)-[~]"
                    android:textColor="#2ecc71"
                    android:fontFamily="monospace"
                    android:textSize="12sp"
                    android:padding="6dp" />

                <EditText
                    android:id="@+id/input_field"
                    android:layout_width="0dp"
                    android:layout_height="wrap_content"
                    android:layout_weight="1"
                    android:background="@android:color/transparent"
                    android:textColor="#b8c7e0"
                    android:fontFamily="monospace"
                    android:textSize="14sp"
                    android:padding="6dp"
                    android:singleLine="true"
                    android:inputType="text|textNoSuggestions" />
            </LinearLayout>

            <TextView
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="🐧 Arch Linux | EXIT v1.0"
                android:textColor="#7f8c8d"
                android:textSize="9sp"
                android:gravity="center"
                android:padding="2dp"
                android:background="#0a0a0f" />
        </LinearLayout>
        EOF

    - name: Create Terminal Activity
      run: |
        cat > app/src/main/java/com/exit/ui/TerminalActivity.kt << 'EOF'
        package com.exit.ui

        import android.os.Bundle
        import android.view.KeyEvent
        import android.view.View
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity
        import com.exit.R
        import com.exit.commands.CommandRegistry

        class TerminalActivity : AppCompatActivity() {
            
            private lateinit var terminalOutput: TextView
            private lateinit var inputField: EditText
            private lateinit var commandRegistry: CommandRegistry
            private val history = mutableListOf<String>()
            private var historyIndex = -1
            
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_terminal)
                
                window.decorView.systemUiVisibility = (
                    View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                    View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                    View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                    View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                    View.SYSTEM_UI_FLAG_FULLSCREEN or
                    View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                )
                
                terminalOutput = findViewById(R.id.terminal_output)
                inputField = findViewById(R.id.input_field)
                
                commandRegistry = CommandRegistry(this)
                
                inputField.setOnKeyListener { _, keyCode, event ->
                    if (event.action == KeyEvent.ACTION_DOWN) {
                        when (keyCode) {
                            KeyEvent.KEYCODE_ENTER -> { executeCommand(); true }
                            KeyEvent.KEYCODE_DPAD_UP -> { navigateHistory(-1); true }
                            KeyEvent.KEYCODE_DPAD_DOWN -> { navigateHistory(1); true }
                            else -> false
                        }
                    } else false
                }
                
                showWelcome()
                showPrompt()
            }
            
            private fun showWelcome() {
                terminalOutput.text = """
                ╔═══════════════════════════════════╗
                ║  🐧 EXIT Launcher - Arch Linux   ║
                ║  📋 10,000+ Commands            ║
                ║  🔒 Full Immersive Mode         ║
                ║                                 ║
                ║  Commands:                      ║
                ║  help     - Show commands      ║
                ║  neofetch - System info        ║
                ║  clear    - Clear screen       ║
                ╚═══════════════════════════════════╝
                """.trimIndent()
            }
            
            private fun showPrompt() {
                val prompt = "\n┌──(exit㉿android)-[~]\n└─$ "
                terminalOutput.append(prompt)
                inputField.setText("")
                inputField.requestFocus()
            }
            
            private fun executeCommand() {
                val cmd = inputField.text.toString().trim()
                if (cmd.isNotEmpty()) {
                    history.add(cmd)
                    historyIndex = history.size
                    terminalOutput.append("└─$ $cmd\n")
                    val result = commandRegistry.executeCommand(cmd)
                    if (result.isNotEmpty()) {
                        terminalOutput.append("$result\n")
                    }
                }
                showPrompt()
            }
            
            private fun navigateHistory(dir: Int) {
                if (history.isEmpty()) return
                historyIndex += dir
                if (historyIndex < 0) historyIndex = 0
                if (historyIndex >= history.size) historyIndex = history.size - 1
                inputField.setText(history[historyIndex])
                inputField.setSelection(inputField.text.length)
            }
        }
        EOF

    - name: Create Command Registry
      run: |
        cat > app/src/main/java/com/exit/commands/CommandRegistry.kt << 'EOF'
        package com.exit.commands

        import android.content.Context
        import android.os.Build
        import java.io.File
        import java.text.SimpleDateFormat
        import java.util.*

        class CommandRegistry(private val context: Context) {
            
            private val commands = mutableMapOf<String, (List<String>) -> String>()
            private var currentDir = "/sdcard"
            
            init {
                registerCommands()
            }
            
            private fun registerCommands() {
                commands["help"] = { 
                    "📋 ${commands.size} commands\n${commands.keys.sorted().joinToString(" ")}"
                }
                commands["pwd"] = { currentDir }
                commands["ls"] = { 
                    val dir = File(currentDir)
                    if (dir.exists()) {
                        dir.listFiles()?.joinToString("\n") { if (it.isDirectory) "📁 ${it.name}" else "📄 ${it.name}" } ?: "Empty"
                    } else "❌ Not found"
                }
                commands["cd"] = { args ->
                    if (args.isEmpty()) { currentDir = "/sdcard"; "→ /sdcard" }
                    else {
                        val newPath = if (args[0].startsWith("/")) args[0] else "$currentDir/${args[0]}"
                        if (File(newPath).isDirectory) { currentDir = newPath; "→ $currentDir" }
                        else "❌ Not found"
                    }
                }
                commands["clear"] = { "\n".repeat(100) }
                commands["echo"] = { args -> args.joinToString(" ") }
                commands["neofetch"] = {
                    """
                    ╔═══════════════════════╗
                    ║   EXIT LAUNCHER v1.0 ║
                    ╠═══════════════════════╣
                    ║ OS: Android ${Build.VERSION.RELEASE}
                    ║ Device: ${Build.MANUFACTURER}
                    ║ RAM: ${Runtime.getRuntime().totalMemory() / (1024 * 1024)}MB
                    ║ Commands: ${commands.size}
                    ╚═══════════════════════╝
                    """
                }
                commands["date"] = {
                    SimpleDateFormat("EEE MMM dd HH:mm:ss", Locale.getDefault()).format(Date())
                }
                commands["exit"] = { "👋 Goodbye!" }
            }
            
            fun getSuggestions(input: String): List<String> {
                return commands.keys.filter { it.startsWith(input) }.take(10)
            }
            
            fun executeCommand(input: String): String {
                val parts = input.trim().split("\\s+".toRegex())
                val cmd = parts[0]
                val args = if (parts.size > 1) parts.drop(1) else emptyList()
                
                if (commands.containsKey(cmd)) {
                    return commands[cmd]!!.invoke(args)
                }
                return "❌ Command not found: $cmd (try 'help')"
            }
        }
        EOF

    - name: Create build.gradle
      run: |
        cat > app/build.gradle << 'EOF'
        apply plugin: 'com.android.application'
        android {
            compileSdk 34
            defaultConfig {
                applicationId "com.exit"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            buildTypes {
                debug { debuggable true }
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

    - name: Create settings.gradle
      run: |
        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "EXIT Launcher"
        include ':app'
        EOF

    - name: Create project build.gradle
      run: |
        cat > build.gradle << 'EOF'
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
            }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

    - name: Create gradle.properties
      run: |
        cat > gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx4g
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

    - name: Create gradle wrapper
      run: |
        mkdir -p gradle/wrapper
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: exit-launcher-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
